<body>
    <header class="site-header">

        <a href="/">Inicio</a>
      
        <a href="/posts/">Archivo</a>
      
        <a href="/about/">Sobre el sitio</a>
      
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar modo claro/oscuro">
        <span id="theme-icon">🌙</span>
      </button>
    </nav>
  </div>
</header>

    <main class="container">
        
<section class="page-content">
  <h1 class="page-title">Literatura</h1>
  
  <ul class="post-list">

        <span class="post-date">20 de Enero, 2026</span>

<script>
  const toggleBtn = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  const html = document.documentElement;

  
  const savedTheme = localStorage.getItem('theme') || 'dark';
  if (savedTheme === 'light') {
    html.classList.add('light-theme');
    icon.textContent = '☀️';
  } else {
    icon.textContent = '🌙';
  }

  toggleBtn.addEventListener('click', () => {
    html.classList.toggle('light-theme');
    const isLight = html.classList.contains('light-theme');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    icon.textContent = isLight ? '☀️' : '🌙';
  });
</script>

</body>
